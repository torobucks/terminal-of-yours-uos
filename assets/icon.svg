<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 128 128"
  font-family="ui-monospace, Consolas, 'Courier New', monospace"
  role="img"
  aria-label="Terminal-of-Yours 图标">

  <!-- 圆角方块底 -->
  <rect x="8" y="8" width="112" height="112" rx="20" fill="#1f2933"/>
  <rect x="8" y="8" width="112" height="112" rx="20" fill="none" stroke="#0e639c" stroke-width="2"/>

  <!-- 终端窗口栏 -->
  <rect x="24" y="26" width="80" height="58" rx="8" fill="#0d1117" stroke="#30363d"/>
  <circle cx="36" cy="38" r="3" fill="#f14c4c"/>
  <circle cx="46" cy="38" r="3" fill="#cca700"/>
  <circle cx="56" cy="38" r="3" fill="#4ec9b0"/>

  <!-- 命令提示符 -->
  <text x="32" y="62" font-size="13" fill="#4ec9b0">&gt;_</text>
  <text x="32" y="78" font-size="11" fill="#9cdcfe">toy run</text>

  <!-- 光标 -->
  <rect x="74" y="69" width="6" height="11" fill="#4ec9b0">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- agent 标记 -->
  <circle cx="86" cy="96" r="16" fill="#8b5cf6"/>
  <text x="86" y="101" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">AI</text>

  <!-- 协同连线 -->
  <line x1="64" y1="96" x2="74" y2="96" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3 3"/>
</svg>
